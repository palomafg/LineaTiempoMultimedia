// Dynamic PIN stored in localStorage (default 6236)
function getEditPin() { return localStorage.getItem('__edit_pin__') || '6236'; }

function changePinDialog() {
  const currentPinInput = prompt('Ingresá el PIN actual para verificar identidad:');
  if (currentPinInput === null) return;
  if (currentPinInput !== getEditPin()) {
    showToast('❌ PIN incorrecto');
    return;
  }
  const newPin = prompt('Nuevo PIN (mínimo 4 dígitos/caracteres):');
  if (newPin === null) return;
  if (!newPin || newPin.trim().length < 4) {
    showToast('❌ El PIN debe tener al menos 4 caracteres');
    return;
  }
  const confirm2 = prompt('Confirmá el nuevo PIN:');
  if (confirm2 !== newPin.trim()) {
    showToast('❌ Los PINes no coinciden');
    return;
  }
  localStorage.setItem('__edit_pin__', newPin.trim());
  showToast('✅ PIN cambiado correctamente');
}

function openPinDialog() {
  const ov = document.getElementById('pin-overlay');
  const inp = document.getElementById('pin-input');
  const err = document.getElementById('pin-error');
  if (!ov || !inp) return;
  err.classList.add('hidden');
  inp.value = '';
  ov.classList.remove('hidden');
  setTimeout(() => inp.focus(), 80);
}

function closePinDialog() {
  const ov = document.getElementById('pin-overlay');
  if (ov) ov.classList.add('hidden');
}

function checkPin(pin) {
  return pin === getEditPin();
}

function enterEditMode() {
  APP.editMode = true;
  document.getElementById('edit-bar').classList.remove('hidden');
  document.getElementById('btn-edit-toggle').style.color = '#F59E0B';
  document.getElementById('btn-edit-toggle').style.borderColor = 'rgba(245,158,11,.4)';
  showToast('✏️ Modo edición activado');
  renderSidebar();
  renderTimeline();
}

function exitEditMode() {
  APP.editMode = false;
  document.getElementById('edit-bar').classList.add('hidden');
  document.getElementById('btn-edit-toggle').style.color = '';
  document.getElementById('btn-edit-toggle').style.borderColor = '';
  closeEditPanel();
  showToast('Modo edición desactivado');
  renderSidebar();
  renderTimeline();
}

function openEditPanel(entry) {
  const panel = document.getElementById('edit-panel');
  const body  = document.getElementById('ep-body');
  const title = document.getElementById('ep-title');
  if (!panel || !body) return;

  title.textContent = 'Editar: ' + (entry.title || '').slice(0, 22) + (entry.title.length > 22 ? '…' : '');
  panel.classList.remove('hidden');

  const cats = Object.keys(CATEGORY_META);
  const catOptions = cats.map(c => `<option value="${c}" ${entry.category === c ? 'selected' : ''}>${CATEGORY_META[c].label}</option>`).join('');

  body.innerHTML = `
    <div class="ep-field">
      <label class="ep-label">Año</label>
      <input class="ep-input" id="ep-year" type="number" min="1800" max="2030" value="${entry.year}">
    </div>
    <div class="ep-field">
      <label class="ep-label">Año fin (opcional)</label>
      <input class="ep-input" id="ep-endyear" type="number" min="1800" max="2030" value="${entry.endYear || ''}">
    </div>
    <div class="ep-field">
      <label class="ep-label">Título</label>
      <input class="ep-input" id="ep-title" type="text" value="${escHtml(entry.title)}">
    </div>
    <div class="ep-field">
      <label class="ep-label">Categoría</label>
      <select class="ep-select ep-input" id="ep-cat">${catOptions}</select>
    </div>
    <div class="ep-field">
      <label class="ep-label">Subcategoría</label>
      <input class="ep-input" id="ep-subcat" type="text" value="${escHtml(entry.subcategory || '')}">
    </div>
    <div class="ep-field">
      <label class="ep-label">Fila (0, 1, 2…)</label>
      <input class="ep-input" id="ep-row" type="number" min="0" max="5" value="${entry.row || 0}">
    </div>
    <div class="ep-field">
      <label class="ep-label">Profundidad (superposición)</label>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="color:#6b7280;font-size:9px">atrás</span>
        <input class="ep-input" id="ep-depth" type="range" min="0" max="10" step="0.1" value="${(entry.depth ?? 5).toFixed(1)}" style="flex:1;cursor:pointer;accent-color:var(--accent)">
        <span style="color:#6b7280;font-size:9px">frente</span>
        <span id="ep-depth-val" style="color:var(--accent);font-size:11px;min-width:28px">${(entry.depth ?? 5).toFixed(1)}</span>
      </div>
      <button id="ep-depth-reset" style="margin-top:5px;padding:4px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--text-muted);font-size:10px;cursor:pointer;width:100%">⟳ Restablecer (5.0)</button>
    </div>
    <div class="ep-field">
      <label class="ep-label">Descripción</label>
      <textarea class="ep-input" id="ep-desc" rows="4">${escHtml(entry.description || '')}</textarea>
    </div>
    <div class="ep-field">
      <label class="ep-label">Detalles Técnicos</label>
      <textarea class="ep-input" id="ep-tech" rows="3">${escHtml(entry.technicalDetails || '')}</textarea>
    </div>
    <div class="ep-field">
      <label class="ep-label">Más información</label>
      <textarea class="ep-input" id="ep-curio" rows="3">${escHtml(entry.curioFact || '')}</textarea>
    </div>
    <div class="ep-field">
      <label class="ep-label">▶ Video (YouTube / Vimeo URL)</label>
      <input class="ep-input" id="ep-video" type="text" value="${escHtml(entry.videoUrl || '')}" placeholder="https://youtu.be/ID_CÓDIGO">
      <div style="display:flex;gap:6px;margin-top:4px">
        <div class="ep-field" style="flex:1">
          <label class="ep-label">Desde</label>
          <input class="ep-input" id="ep-tc-from" type="text" value="${escHtml(entry.videoFrom || '')}" placeholder="MM:SS o HH:MM:SS">
        </div>
        <div class="ep-field" style="flex:1">
          <label class="ep-label">Hasta</label>
          <input class="ep-input" id="ep-tc-to" type="text" value="${escHtml(entry.videoTo || '')}" placeholder="MM:SS o HH:MM:SS">
        </div>
      </div>
    </div>
    <div class="ep-field">
      <label class="ep-label">Imagen principal</label>
      <div style="display:flex;gap:6px;align-items:center">
        <input class="ep-input" id="ep-img" type="text" value="${escHtml(APP.customImages[entry.id] || entry.image || '')}" placeholder="URL de imagen" style="flex:1">
        <button id="ep-img-pick" title="Subir desde PC" style="padding:6px 10px;border-radius:6px;border:1px solid rgba(129,140,248,.4);background:rgba(129,140,248,.1);color:#818cf8;cursor:pointer;font-size:13px;flex-shrink:0">📷</button>
      </div>
    </div>
    <div class="ep-field">
      <label class="ep-label">Imágenes adicionales</label>
      <div class="ep-img-strip" id="ep-extra-strip">${
        ((APP.editData[entry.id]?.extraImages) || entry.extraImages || []).map((u,i) =>
          `<div class="ep-img-thumb"><img src="${escHtml(u)}" onerror="this.src=''"><button class="ep-img-thumb-del" data-idx="${i}">✕</button></div>`
        ).join('')
      }</div>
      <div style="display:flex;gap:5px;margin-top:4px">
        <input class="ep-input" id="ep-extra-url" placeholder="URL imagen extra" style="flex:1;font-size:11px">
        <button id="ep-extra-add" style="padding:5px 8px;border-radius:5px;border:1px solid rgba(129,140,248,.4);background:rgba(129,140,248,.1);color:#818cf8;cursor:pointer;font-size:11px;flex-shrink:0">＋</button>
        <button id="ep-extra-pick" title="Subir desde PC" style="padding:5px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);cursor:pointer;font-size:11px;flex-shrink:0">📷</button>
      </div>
    </div>
    <div class="ep-field">
      <label class="ep-label">Marcadores personales</label>
      <div id="ep-markers-list" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">${
        APP.customMarkers.map(mk => {
          const has = (entry.markers||[]).includes(mk.id);
          return `<span class="mk-chip ${has?'assigned':''}" data-mkid="${mk.id}" style="background:${mk.color}22;color:${mk.color};border-color:${mk.color}55">${mk.name}</span>`;
        }).join('')
      }${APP.customMarkers.length===0?'<span style="font-size:10px;color:#4a5568">Aún no hay marcadores. Creá uno abajo.</span>':''}</div>
      <div style="display:flex;gap:5px;align-items:center">
        <input class="ep-input" id="ep-mk-name" placeholder="Nombre marcador" style="flex:1;font-size:11px">
        <input type="color" id="ep-mk-color" value="#818cf8" title="Color" style="width:28px;height:28px;border-radius:5px;border:1px solid rgba(255,255,255,.15);background:none;cursor:pointer;padding:2px">
        <button id="ep-mk-create" style="padding:5px 8px;border-radius:5px;border:1px solid rgba(129,140,248,.4);background:rgba(129,140,248,.1);color:#818cf8;cursor:pointer;font-size:11px;flex-shrink:0">＋ Crear</button>
      </div>
    </div>
    <label class="ep-checkbox-row">
      <input type="checkbox" id="ep-nipkow" ${entry.isNipkow ? 'checked' : ''}>
      <span class="ep-checkbox-label">🔘 Mostrar Disco de Nipkow</span>
    </label>
    <div class="ep-field">
      <label class="ep-label">Escala de tarjeta</label>
      <input class="ep-input" id="ep-scale" type="range" min="0.3" max="4" step="0.05" value="${(APP.cardScales[entry.id] || 1).toFixed(2)}" style="width:100%;accent-color:var(--accent);cursor:pointer">
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted);margin-top:1px"><span>0.3×</span><span id="ep-scale-val" style="color:var(--accent);font-weight:700">${(APP.cardScales[entry.id] || 1).toFixed(2)}×</span><span>4.0×</span></div>
      <button id="ep-scale-reset" style="margin-top:5px;padding:4px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--text-muted);font-size:10px;cursor:pointer;width:100%">⟳ Restablecer escala (1.0×)</button>
    </div>
    <button class="ep-btn-save" id="ep-save-btn">💾 Guardar cambios</button>
    <button class="ep-btn-del" id="ep-del-btn">🗑 Eliminar tarjeta</button>`;

  // ── Extra images management ──
  function getExtraImages() {
    return (APP.editData[entry.id]?.extraImages) || entry.extraImages || [];
  }
  function setExtraImages(arr) {
    APP.editData[entry.id] = { ...(APP.editData[entry.id]||{}), extraImages: arr };
  }
  function renderExtraStrip() {
    const strip = document.getElementById('ep-extra-strip');
    if (!strip) return;
    strip.innerHTML = getExtraImages().map((u,i) =>
      `<div class="ep-img-thumb"><img src="${escHtml(u)}" onerror="this.src=''"><button class="ep-img-thumb-del" data-idx="${i}">✕</button></div>`
    ).join('');
    strip.querySelectorAll('.ep-img-thumb-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const imgs = [...getExtraImages()]; imgs.splice(+btn.dataset.idx,1);
        setExtraImages(imgs); renderExtraStrip();
      });
    });
  }
  renderExtraStrip();
  document.getElementById('ep-extra-add')?.addEventListener('click', () => {
    const val = document.getElementById('ep-extra-url')?.value?.trim();
    if (!val) return;
    setExtraImages([...getExtraImages(), val]);
    document.getElementById('ep-extra-url').value = '';
    renderExtraStrip();
  });
  document.getElementById('ep-extra-pick')?.addEventListener('click', () => {
    pickLocalImg(entry.id + '-extra-' + Date.now(), (dataUrl) => {
      setExtraImages([...getExtraImages(), dataUrl]);
      renderExtraStrip();
      showToast('📷 Imagen extra agregada');
    });
  });

  // ── Markers: toggle assigned + create new ──
  document.getElementById('ep-markers-list')?.addEventListener('click', (ev) => {
    const chip = ev.target.closest('.mk-chip');
    if (!chip) return;
    chip.classList.toggle('assigned');
  });
  document.getElementById('ep-mk-create')?.addEventListener('click', () => {
    const name = document.getElementById('ep-mk-name')?.value?.trim();
    const color = document.getElementById('ep-mk-color')?.value || '#818cf8';
    if (!name) { showToast('⚠ Escribí un nombre para el marcador'); return; }
    const mk = { id: 'mk-' + Date.now(), name, color };
    APP.customMarkers.push(mk);
    saveToStorage();
    renderHeaderMarkers();
    const list = document.getElementById('ep-markers-list');
    if (list) {
      const chip = document.createElement('span');
      chip.className = 'mk-chip';
      chip.dataset.mkid = mk.id;
      chip.style.cssText = `background:${color}22;color:${color};border-color:${color}55`;
      chip.textContent = name;
      list.appendChild(chip);
      document.getElementById('ep-mk-name').value = '';
    }
    showToast(`🏷 Marcador "${name}" creado`);
  });

  // Image picker button in edit panel
  const epImgPick = document.getElementById('ep-img-pick');
  if (epImgPick) {
    epImgPick.addEventListener('click', () => {
      pickLocalImg(entry.id, (dataUrl) => {
        APP.customImages[entry.id] = dataUrl;
        document.getElementById('ep-img').value = dataUrl.substring(0,40)+'…';
        showToast('📷 Imagen principal guardada');
      });
    });
  }

  // Scale slider: live preview label + reset button
  const epScale = document.getElementById('ep-scale');
  const epScaleVal = document.getElementById('ep-scale-val');
  const epScaleReset = document.getElementById('ep-scale-reset');
  if (epScale && epScaleVal) {
    epScale.addEventListener('input', () => {
      epScaleVal.textContent = parseFloat(epScale.value).toFixed(2) + '×';
      // Live preview — apply immediately without saving
      APP.cardScales[entry.id] = parseFloat(epScale.value);
      renderTimeline();
    });
  }
  if (epScaleReset) {
    epScaleReset.addEventListener('click', () => {
      if (epScale) { epScale.value = '1'; }
      if (epScaleVal) { epScaleVal.textContent = '1.00×'; }
      APP.cardScales[entry.id] = 1;
      renderTimeline();
      showToast('⟳ Escala restablecida a 1.0×');
    });
  }

  // Depth slider: live preview + reset button
  const epDepth = document.getElementById('ep-depth');
  const epDepthVal = document.getElementById('ep-depth-val');
  const epDepthReset = document.getElementById('ep-depth-reset');
  if (epDepth && epDepthVal) {
    epDepth.addEventListener('input', () => {
      const val = parseFloat(epDepth.value);
      epDepthVal.textContent = val.toFixed(1);
      if (!APP.editData[entry.id]) APP.editData[entry.id] = {};
      APP.editData[entry.id].depth = val;
      renderTimeline();
    });
  }
  if (epDepthReset) {
    epDepthReset.addEventListener('click', () => {
      if (epDepth) { epDepth.value = '5.0'; }
      if (epDepthVal) { epDepthVal.textContent = '5.0'; }
      if (APP.editData[entry.id]) {
        APP.editData[entry.id].depth = 5.0;
      }
      renderTimeline();
      showToast('⟳ Profundidad restablecida a 5.0');
    });
  }

  // Save button
  document.getElementById('ep-save-btn').addEventListener('click', () => {
    pushUndo();
    const overrides = {
      year:             parseInt(document.getElementById('ep-year').value, 10) || entry.year,
      endYear:          parseInt(document.getElementById('ep-endyear').value, 10) || undefined,
      title:            document.getElementById('ep-title').value,
      category:         document.getElementById('ep-cat').value,
      subcategory:      document.getElementById('ep-subcat').value,
      row:              parseInt(document.getElementById('ep-row').value, 10) || 0,
      depth:            parseFloat(document.getElementById('ep-depth').value) ?? 5.0,
      description:      document.getElementById('ep-desc').value,
      technicalDetails: document.getElementById('ep-tech').value,
      curioFact:        document.getElementById('ep-curio').value,
      videoUrl:         document.getElementById('ep-video')?.value?.trim() || '',
      videoFrom:        document.getElementById('ep-tc-from')?.value?.trim() || '',
      videoTo:          document.getElementById('ep-tc-to')?.value?.trim() || '',
      isNipkow:         document.getElementById('ep-nipkow').checked,
      extraImages:      (APP.editData[entry.id]?.extraImages) || entry.extraImages || [],
      markers:          Array.from(document.querySelectorAll('#ep-markers-list .mk-chip.assigned')).map(c=>c.dataset.mkid),
    };
    const imgUrl = document.getElementById('ep-img').value.trim();
    if (imgUrl) APP.customImages[entry.id] = imgUrl;
    const scaleVal = parseFloat(document.getElementById('ep-scale')?.value) || 1;
    APP.cardScales[entry.id] = Math.max(0.3, Math.min(4, scaleVal));
    if (!overrides.endYear) delete overrides.endYear;
    APP.editData[entry.id] = { ...(APP.editData[entry.id] || {}), ...overrides };
    saveToStorage();
    renderSidebar();
    renderTimeline();
    renderCarousel();
    renderHeaderMarkers();
    showToast('✅ Cambios guardados');
  });

  // Delete button
  document.getElementById('ep-del-btn').addEventListener('click', () => {
    if (!confirm(`¿Eliminar "${entry.title}"?`)) return;
    pushUndo();
    APP.deletedIds.push(entry.id);
    saveToStorage();
    closeEditPanel();
    renderSidebar();
    renderTimeline();
    renderCarousel();
    showToast('🗑 Tarjeta eliminada');
  });
}

function closeEditPanel() {
  const panel = document.getElementById('edit-panel');
  if (panel) panel.classList.add('hidden');
}

function addNewEntryAtYear(year, category) {
  const cats = getAboveCats().concat(getBelowCats());
  const newEntry = {
    id:   `user-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
    year: Math.max(1820, Math.min(2025, year || 1950)),
    title: 'Nuevo Formato',
    category: category || cats[0] || 'IMAGEN',
    subcategory: 'SIN CATEGORÍA',
    description: 'Descripción del formato. Editar con clic en modo edición.',
    technicalDetails: '',
    curioFact: '',
    row: 0,
  };
  pushUndo();
  APP.userEntries.push(newEntry);
  saveToStorage();
  renderSidebar();
  renderTimeline();
  const viewport = document.getElementById('tl-viewport');
  const x = yearToX(newEntry.year);
  if (viewport) viewport.scrollTo({ left: Math.max(0, x - viewport.clientWidth / 2), behavior: 'smooth' });
  showToast(`✅ Tarjeta creada en ${newEntry.year}. Hacé clic para editar.`);
}

function addNewEntry() {
  const viewport = document.getElementById('tl-viewport');
  const centerYear = Math.round(xToYear((viewport?.scrollLeft || 0) + (viewport?.clientWidth || 800) / 2));
  const cats = getAboveCats();
  const newEntry = {
    id:   `user-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
    year: Math.max(1820, Math.min(2025, centerYear)),
    title: 'Nuevo Formato',
    category: cats[0] || 'IMAGEN',
    subcategory: 'SIN CATEGORÍA',
    description: 'Descripción del formato. Editar en modo edición.',
    technicalDetails: 'Detalles técnicos a completar.',
    curioFact: '',
    row: 0,
  };
  pushUndo();
  APP.userEntries.push(newEntry);
  saveToStorage();
  renderSidebar();
  renderTimeline();

  // Scroll to new entry
  const x = yearToX(newEntry.year);
  if (viewport) {
    viewport.scrollTo({ left: Math.max(0, x - viewport.clientWidth / 2), behavior: 'smooth' });
  }

  showToast(`✅ Tarjeta creada en ${newEntry.year}`);
  openEditPanel({ ...newEntry });
}

function showContextMenu(x, y, entry, type) {
  const menu = document.getElementById('ctx-menu');
  if (!menu) return;
  type = type || 'card';

  const items = [];

  // ── Image change option (always available via right-click on image) ──
  if (type === 'image') {
    items.push({ ico: '📷', label: 'Cambiar imagen (PC)…', action: () => {
      pickLocalImg(entry.id, (dataUrl) => {
        renderTimeline();
        // If modal is open for this entry, refresh it
        if (APP.selectedEntryId === entry.id) {
          const e2 = getAllEntries().find(x => x.id === entry.id);
          if (e2) { closeModal(); openModal(e2); }
        }
        showToast('📷 Imagen guardada localmente');
      });
    }});
    items.push({ ico: '🔗', label: 'URL de imagen…', action: () => {
      const url = prompt('URL de la imagen:', APP.customImages[entry.id] || entry.image || '');
      if (url === null) return;
      pushUndo();
      APP.customImages[entry.id] = url.trim();
      saveToStorage(); renderTimeline();
      if (APP.selectedEntryId === entry.id) {
        const e2 = getAllEntries().find(x => x.id === entry.id);
        if (e2) { closeModal(); openModal(e2); }
      }
      showToast('🖼 Imagen actualizada');
    }});
    // Only show reset if there's a custom image
    if (getLocalImg(entry.id) || APP.customImages[entry.id]) {
      items.push({ ico: '↩', label: 'Restablecer imagen original', action: () => {
        pushUndo();
        try { localStorage.removeItem('__img_' + entry.id); } catch(e) {}
        delete APP.customImages[entry.id];
        saveToStorage(); renderTimeline();
        if (APP.selectedEntryId === entry.id) {
          const e2 = getAllEntries().find(x => x.id === entry.id);
          if (e2) { closeModal(); openModal(e2); }
        }
        showToast('↩ Imagen restablecida al original');
      }});
    }
    items.push({ sep: true });
  }

  if (APP.editMode) {
    items.push({ ico: '✏️', label: 'Editar tarjeta', action: () => openEditPanel(entry) });
    if (APP.connectingFrom) {
      items.push({ ico: '✕', label: 'Cancelar conexión pendiente', action: () => {
        APP.connectingFrom = null; renderTimeline(); showToast('Conexión cancelada');
      }});
    }
    if (APP.nodeConns.some(c => c.fromCard === entry.id || c.toCard === entry.id)) {
      items.push({ ico: '✂️', label: 'Borrar conexiones', action: () => {
        pushUndo();
        APP.nodeConns = APP.nodeConns.filter(c => c.fromCard !== entry.id && c.toCard !== entry.id);
        saveToStorage(); renderConnections();
        showToast('Conexiones eliminadas');
      }});
    }
    items.push({ ico: '↕', label: 'Distancia al eje…', action: () => { hideContextMenu(); showRowSlider(x, y, entry); } });
    items.push({ ico: '↕', label: 'Profundidad (Z)…', action: () => { hideContextMenu(); showDepthSlider(x, y, entry); } });
    items.push({ ico: '⤢', label: 'Escalar tarjeta…', action: () => {
      const current = APP.cardScales[entry.id] || 1;
      const sc = prompt(`Escala de tarjeta\n0.5 = mitad · 1 = normal · 2 = doble\nActual: ${current.toFixed(2)}×`, current.toFixed(2));
      if (sc === null) return;
      const n = parseFloat(sc);
      if (isNaN(n) || n < 0.3 || n > 4) { showToast('⚠️ Escala inválida (0.3 – 4.0)'); return; }
      pushUndo();
      APP.cardScales[entry.id] = n;
      saveToStorage(); renderTimeline();
      showToast(`⤢ Escala aplicada: ${n.toFixed(2)}×`);
    }});
    if (type !== 'image') {
      items.push({ ico: '📷', label: 'Cambiar imagen…', action: () => {
        pickLocalImg(entry.id, (dataUrl) => {
          renderTimeline();
          showToast('📷 Imagen guardada localmente');
        });
      }});
      if (getLocalImg(entry.id) || APP.customImages[entry.id]) {
        items.push({ ico: '↩', label: 'Restablecer imagen original', action: () => {
          pushUndo();
          try { localStorage.removeItem('__img_' + entry.id); } catch(e) {}
          delete APP.customImages[entry.id];
          saveToStorage(); renderTimeline();
          showToast('↩ Imagen restablecida');
        }});
      }
    }
    items.push({ sep: true });
    items.push({ ico: '🗑', label: 'Eliminar tarjeta', danger: true, action: () => {
      if (!confirm(`¿Eliminar "${entry.title}"?`)) return;
      pushUndo();
      APP.deletedIds.push(entry.id);
      saveToStorage(); closeEditPanel(); renderSidebar(); renderTimeline(); renderCarousel();
      showToast('🗑 Tarjeta eliminada');
    }});
  } else {
    items.push({ ico: 'ℹ', label: 'Ver detalle', action: () => openModal(entry) });
    items.push({ ico: '🔒', label: 'Editar (requiere modo edición)', action: () => {
      hideContextMenu();

function pushUndo() {
  const snapshot = {
    editData:     JSON.parse(JSON.stringify(APP.editData)),
    customImages: JSON.parse(JSON.stringify(APP.customImages)),
    cardScales:   JSON.parse(JSON.stringify(APP.cardScales)),
    nodeConns:    JSON.parse(JSON.stringify(APP.nodeConns)),
    deletedIds:   [...APP.deletedIds],
    userEntries:  JSON.parse(JSON.stringify(APP.userEntries)),
    customCatNames: JSON.parse(JSON.stringify(APP.customCatNames)),
  };
  APP.undoStack.push(snapshot);
  if (APP.undoStack.length > 50) APP.undoStack.shift();
}

function undo() {
  if (!APP.undoStack.length) { showToast('Nada que deshacer'); return; }
  const snap = APP.undoStack.pop();
  APP.editData     = snap.editData;
  APP.customImages = snap.customImages;
  APP.cardScales   = snap.cardScales;
  APP.nodeConns    = snap.nodeConns;
  APP.deletedIds   = snap.deletedIds;
  APP.userEntries  = snap.userEntries;
  APP.customCatNames = snap.customCatNames;
  saveToStorage();
  renderSidebar(); renderTimeline(); renderCarousel();
  showToast('↩ Deshecho');
}

   PART 12 · SAVE / LOAD JSON + LOCALSTORAGE

const LS_KEY = 'av-timeline-state-v2';

function buildSavePayload() {
  const vp = document.getElementById('tl-viewport');
  return {
    version: '2.1',
    savedAt: new Date().toISOString(),
    editData:       APP.editData,
    customImages:   APP.customImages,
    cardScales:     APP.cardScales,
    nodeConns:      APP.nodeConns,
    deletedIds:     APP.deletedIds,
    userEntries:    APP.userEntries,
    customMarkers:  APP.customMarkers,
    catOrder:       APP.catOrder,
    belowAxisArr:   APP.belowAxisArr,
    customCatNames: APP.customCatNames,
    collapsedCats:  APP.collapsedCats,
    hiddenCats:     APP.hiddenCats,
    zoom:           APP.zoom,
    vZoom:          APP.vZoom,
    projectTitle:    APP.projectTitle,
    projectSubtitle: APP.projectSubtitle,
    // Posición de navegación
    scrollX: vp ? vp.scrollLeft : 0,
    scrollY: vp ? vp.scrollTop  : 0,
  };
}

function restoreFromPayload(data) {
  if (!data) return;
  APP.editData     = data.editData     || {};
  APP.customImages = data.customImages || {};
  APP.cardScales   = data.cardScales   || {};
  APP.nodeConns    = data.nodeConns    || [];
  APP.deletedIds   = data.deletedIds   || [];
  APP.userEntries  = data.userEntries  || [];
  APP.customMarkers= data.customMarkers|| [];
  APP.catOrder     = data.catOrder     || ['IMAGEN','CINE','VIDEO','AUDIO','DIGITAL'];
  APP.belowAxisArr = data.belowAxisArr || ['DIGITAL'];
  APP.customCatNames= data.customCatNames || {};
  APP.collapsedCats= data.collapsedCats|| [];
  APP.hiddenCats   = data.hiddenCats   || [];
  if (data.zoom)  APP.zoom  = data.zoom;
  if (data.vZoom) APP.vZoom = data.vZoom;
  if (data.projectTitle)    APP.projectTitle    = data.projectTitle;
  if (data.projectSubtitle) APP.projectSubtitle = data.projectSubtitle;
  // Guardar scroll para restaurar después del render
  APP._pendingScrollX = (data.scrollX !== undefined) ? data.scrollX : null;
  APP._pendingScrollY = (data.scrollY !== undefined) ? data.scrollY : null;
  applyProjectTitles();
}

function saveToStorage() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(buildSavePayload()));
  } catch(e) { /* quota exceeded or private mode */ }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) restoreFromPayload(JSON.parse(raw));
  } catch(e) { /* parse error */ }
}

// ── Export to .json file ──
function guardarDatos() {
  const data = buildSavePayload();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `av-timeline-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  showToast('💾 Guardado como JSON');
}

// ── Import from .json file ──
function cargarDatos(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      pushUndo();
      restoreFromPayload(data);
      saveToStorage();
      renderSidebar();
      renderTimeline();
      renderCarousel();
      updateZoomDisplay();
      renderHeaderMarkers();
      // Restaurar posición de navegación después de que el DOM se actualice
      setTimeout(() => {
        const vp = document.getElementById('tl-viewport');
        if (vp) {
          if (APP._pendingScrollX !== null) vp.scrollLeft = APP._pendingScrollX;
          if (APP._pendingScrollY !== null) vp.scrollTop  = APP._pendingScrollY;
          APP._pendingScrollX = null;
          APP._pendingScrollY = null;
        }
      }, 120);
      showToast('📂 Estado restaurado desde JSON · posición recuperada');
    } catch (err) {
      showToast('⚠️ Error al leer el archivo JSON');
    }
  };
  reader.readAsText(file);
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* ── Category reorder ── */
function moveCatOrder(cat, dir) {
  pushUndo();
  const idx = APP.catOrder.indexOf(cat);
  if (idx < 0) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= APP.catOrder.length) return;
  const arr = [...APP.catOrder];
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  APP.catOrder = arr;
  saveToStorage(); renderSidebar(); renderTimeline();
}

/* ── Move category to/from below axis ── */
function toggleCatAxis(cat) {
  pushUndo();
  const s = new Set(APP.belowAxisArr);
  s.has(cat) ? s.delete(cat) : s.add(cat);
  APP.belowAxisArr = [...s];
  saveToStorage(); renderSidebar(); renderTimeline();
}

/* ── Enforce scroll bounds (prevent scrolling past 1820–2025) ── */
function enforceScrollBounds() {
  const vp = document.getElementById('tl-viewport');
  if (!vp) return;
  const margin = 30;
  const minX = 0; // allow scrolling to START_YEAR (1785)
  const maxX = Math.max(minX, yearToX(2025) - vp.clientWidth + margin);
  if (vp.scrollLeft < minX) vp.scrollLeft = minX;
  if (maxX > minX && vp.scrollLeft > maxX) vp.scrollLeft = maxX;
}

function enforceVerticalScrollBounds() {
  const vp = document.getElementById('tl-viewport');
  if (!vp) return;
  const totalH = getTotalH();
  const maxY   = Math.max(0, totalH - vp.clientHeight);
  if (vp.scrollTop < 0)    vp.scrollTop = 0;
  if (vp.scrollTop > maxY) vp.scrollTop = maxY;
}

function syncSidebarScroll() {
  const vp    = document.getElementById('tl-viewport');
  const inner = document.getElementById('sidebar-cats-inner');
  const cats  = document.getElementById('sidebar-cats');
  if (!vp || !inner || !cats) return;
  const vpTop   = vp.getBoundingClientRect().top;
  const catsTop = cats.getBoundingClientRect().top;
  const T = vpTop - catsTop - vp.scrollTop;
  inner.style.transform = `translateY(${T}px)`;
}

function positionHalo() {
  const halo = document.getElementById('halo-overlay');
  const vp   = document.getElementById('tl-viewport');
  if (!halo || !vp) return;
  const axisAbsY = getAxisY() + C.STRIP_H + C.AXIS_LINE_REL;
  const vpRect   = vp.getBoundingClientRect();
  const screenY  = vpRect.top + (axisAbsY - vp.scrollTop) - 170;
  halo.style.top = Math.max(vpRect.top, screenY) + 'px';
}

function timecodeToSecs(tc) {
  if (!tc || !tc.trim()) return 0;
  const parts = tc.trim().split(':').map(Number);
  if (parts.some(isNaN)) return 0;
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return 0;
}

function parseVideoEmbed(url, fromTc, toTc) {
  if (!url) return null;
  const startSec = timecodeToSecs(fromTc || '');
  const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?#\s]+)/);
  if (ytMatch) {
    const tFallback = url.match(/[?&]t=?(\d+)/);
    const start = startSec > 0 ? startSec : (tFallback ? parseInt(tFallback[1]) : 0);
    const end   = timecodeToSecs(toTc || '');
    const startParam = start > 0 ? `&start=${start}` : '';
    const endParam   = end   > 0 ? `&end=${end}`     : '';
    return `https://www.youtube.com/embed/${ytMatch[1]}?rel=0&modestbranding=1${startParam}${endParam}`;
  }
  const vmMatch = url.match(/vimeo\.com\/(\d+)/);
  if (vmMatch) {
    const tFallback = url.match(/#t=(\d+)/);
    const t = startSec > 0 ? `#t=${startSec}` : (tFallback ? `#t=${tFallback[1]}` : '');
    return `https://player.vimeo.com/video/${vmMatch[1]}${t}`;
  }
  return null;
}

function getMinZoom() {
  // Min zoom: the 1820–2025 range must fill at least the viewport width
  const vp = document.getElementById('tl-viewport');
  const vpW = vp ? vp.clientWidth : 900;
  // At min zoom the 205-year span should exactly fill the viewport
  const spanYears = 2025 - 1820; // 205 years
  const minFromSpan = vpW / (spanYears * C.BASE_PX);
  return Math.max(0.18, minFromSpan * 0.85); // 15% slack so edges are just visible
}

function setZoom(newZoom, pivotX) {
  const vp = document.getElementById('tl-viewport');
  const oldZoom = APP.zoom;
  APP.zoom = clamp(newZoom, getMinZoom(), 10);

  if (vp && pivotX !== undefined) {
    const ratio = APP.zoom / oldZoom;
    vp.scrollLeft = pivotX * ratio - (pivotX - vp.scrollLeft);
  }

  updateZoomDisplay();
  renderTimeline();
  setTimeout(enforceScrollBounds, 10);
}

function setVZoom(newVZ) {
  APP.vZoom = clamp(newVZ, 0.6, 4.0);
  updateZoomDisplay();
  renderTimeline();
  setTimeout(enforceVerticalScrollBounds, 10);
}

function updateZoomDisplay() {
  const zv  = document.getElementById('zoom-val');
  const vzv = document.getElementById('vzoom-val');
  if (zv)  zv.textContent  = Math.round(APP.zoom  * 100) + '%';
  if (vzv) vzv.textContent = Math.round(APP.vZoom * 100) + '%';
}

function initSidebarResize() {
  const resizer = document.getElementById('sidebar-resizer');
  const sidebar = document.getElementById('sidebar');
  if (!resizer || !sidebar) return;

  let dragging = false, startX = 0, startW = 0;

  resizer.addEventListener('mousedown', (e) => {
    dragging = true;
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const newW = clamp(startW + e.clientX - startX, 80, 320);
    sidebar.style.width = newW + 'px';
    sidebar.style.minWidth = newW + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function setupEvents() {
  // ── Modal ──
  document.getElementById('modal-backdrop')?.addEventListener('click', closeModal);
  document.getElementById('modal-close-btn')?.addEventListener('click', closeModal);
  document.getElementById('modal-expand-btn')?.addEventListener('click', () => {
    APP.modalExpanded = !APP.modalExpanded;
    const box = document.getElementById('modal-box');
    if (box) box.classList.toggle('expanded', APP.modalExpanded);
    document.getElementById('modal-expand-btn').textContent = APP.modalExpanded ? '⤡' : '⤢';
  });

  // ── Global key shortcuts ──
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      // Salir de fullscreen si está activo, si no: cerrar modal/menú/panel
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      } else {
        closeModal(); hideContextMenu(); closeEditPanel(); closePinDialog();
      }
    }
    if (e.key === 'f' || e.key === 'F') {
      if (document.getElementById('modal')?.classList.contains('hidden') === false) {
        APP.modalExpanded = !APP.modalExpanded;
        const box = document.getElementById('modal-box');
        if (box) box.classList.toggle('expanded', APP.modalExpanded);
        document.getElementById('modal-expand-btn').textContent = APP.modalExpanded ? '⤡' : '⤢';
      }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && APP.editMode) { e.preventDefault(); undo(); }
    // ── Ctrl+M → Pantalla completa ──
    if ((e.ctrlKey || e.metaKey) && (e.key === 'm' || e.key === 'M')) {
      e.preventDefault();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }
  });

  // ── Zoom with wheel ──
  const vp = document.getElementById('tl-viewport');
  if (vp) {
    vp.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const delta = -e.deltaY * 0.001;
        const rect  = vp.getBoundingClientRect();
        const pivotX = (e.clientX - rect.left) + vp.scrollLeft;
        setZoom(APP.zoom * (1 + delta * 3), pivotX);
        saveToStorage();
      } else if (e.altKey) {
        e.preventDefault();
        const delta = -e.deltaY * 0.001;
        setVZoom(APP.vZoom * (1 + delta * 3));
        saveToStorage();
      }
    }, { passive: false });

    // Horizontal scroll with shift+wheel (for trackpads)
    vp.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.altKey && !e.shiftKey && Math.abs(e.deltaX) < Math.abs(e.deltaY)) {
        // Allow natural vertical scroll in viewport — do nothing special
      }
    });
  }

  // ── Zoom buttons ──
  document.getElementById('zoom-in')?.addEventListener('click', () => { setZoom(APP.zoom * 1.25); saveToStorage(); });
  document.getElementById('zoom-out')?.addEventListener('click', () => { setZoom(APP.zoom * 0.8); saveToStorage(); });
  document.getElementById('vzoom-in')?.addEventListener('click', () => { setVZoom(APP.vZoom * 1.25); saveToStorage(); });
  document.getElementById('vzoom-out')?.addEventListener('click', () => { setVZoom(APP.vZoom * 0.8); saveToStorage(); });
  document.getElementById('zoom-reset')?.addEventListener('click', () => { APP.zoom = 1; APP.vZoom = 1; updateZoomDisplay(); saveToStorage(); renderTimeline(); });
  document.getElementById('zoom-reset')?.addEventListener('dblclick', () => { APP.zoom = 1; APP.vZoom = 1; updateZoomDisplay(); saveToStorage(); renderTimeline(); });

  // ── Search ──
  const searchInp = document.getElementById('search-input');
  searchInp?.addEventListener('input', (e) => doSearch(e.target.value));
  document.getElementById('search-clear')?.addEventListener('click', () => {
    searchInp.value = '';
    doSearch('');
  });

  // ── Save / Load JSON ──
  document.getElementById('btn-save')?.addEventListener('click', guardarDatos);
  document.getElementById('btn-load')?.addEventListener('click', () => {
    document.getElementById('file-input').click();
  });
  document.getElementById('file-input')?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (file) cargarDatos(file);
    e.target.value = ''; // reset so same file can be loaded again
  });

  // ── Edit Mode Toggle (PIN) ──
  document.getElementById('btn-edit-toggle')?.addEventListener('click', () => {
    if (APP.editMode) { exitEditMode(); }
    else { openPinDialog(); }
  });

  // ── PIN Dialog ──
  document.getElementById('pin-ok')?.addEventListener('click', () => {
    const pin = document.getElementById('pin-input')?.value || '';
    if (checkPin(pin)) {
      closePinDialog();
      enterEditMode();
    } else {
      const err = document.getElementById('pin-error');
      if (err) { err.classList.remove('hidden'); err.style.animation = 'none'; requestAnimationFrame(() => { err.style.animation = ''; }); }
    }
  });
  document.getElementById('pin-cancel')?.addEventListener('click', closePinDialog);
  document.getElementById('pin-input')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('pin-ok').click();
    if (e.key === 'Escape') closePinDialog();
  });
  document.getElementById('pin-overlay')?.addEventListener('click', (e) => {
    if (e.target === document.getElementById('pin-overlay')) closePinDialog();
  });

  // ── Edit Bar actions ──
  document.getElementById('btn-add')?.addEventListener('click', () => { if (APP.editMode) addNewEntry(); });
  document.getElementById('btn-undo')?.addEventListener('click', () => { if (APP.editMode) undo(); });
  document.getElementById('btn-exit-edit')?.addEventListener('click', exitEditMode);
  document.getElementById('ep-close')?.addEventListener('click', closeEditPanel);

  document.getElementById('btn-change-pin')?.addEventListener('click', () => {
    if (APP.editMode) changePinDialog();
  });

  // ── Editable Logo Title & Subtitle (right-click always, dblclick in edit mode) ──
  function makeLogoEditable(elId, field) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.title = 'Clic derecho para editar';
    el.style.cursor = 'default';

    function activateEdit(e) {
      e.stopPropagation();
      const current = APP[field];
      const inp = document.createElement('input');
      inp.value = current;
      inp.style.background = 'rgba(255,255,255,.08)';
      inp.style.border = '1px solid rgba(99,102,241,.5)';
      inp.style.borderRadius = '3px';
      inp.style.outline = 'none';
      inp.style.color = window.getComputedStyle(el).color;
      inp.style.fontSize = window.getComputedStyle(el).fontSize;
      inp.style.fontWeight = window.getComputedStyle(el).fontWeight;
      inp.style.letterSpacing = window.getComputedStyle(el).letterSpacing;
      inp.style.width = '90%';
      inp.style.padding = '2px 4px';
      inp.style.boxSizing = 'border-box';
      el.replaceWith(inp);
      inp.focus(); inp.select();
      const commit = () => {
        APP[field] = inp.value.trim() || current;
        saveToStorage();
        inp.replaceWith(el);
        applyProjectTitles();
      };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', (e2) => {
        if (e2.key === 'Enter') { e2.preventDefault(); commit(); }
        if (e2.key === 'Escape') { inp.value = current; commit(); }
      });
    }

    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      activateEdit(e);
    });
    el.addEventListener('dblclick', (e) => {
      activateEdit(e);
    });
  }
  makeLogoEditable('logo-title', 'projectTitle');
  makeLogoEditable('logo-subtitle', 'projectSubtitle');

  // ── Context Menu — close on click outside ──
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('ctx-menu');
    if (menu && !menu.contains(e.target)) hideContextMenu();
  });

  // ── Canvas click (deselect) ──
  document.getElementById('tl-canvas')?.addEventListener('click', () => {
    hideContextMenu();
  });

  // ── Canvas right-click en fondo: agregar tarjeta en ese año ──
  document.getElementById('tl-canvas')?.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.entry-card') || e.target.closest('#ctx-menu')) return;
    e.preventDefault();
    const vp = document.getElementById('tl-viewport');
    const rect = vp.getBoundingClientRect();
    const clickX = e.clientX - rect.left + vp.scrollLeft;
    const clickedYear = Math.max(1820, Math.min(2025, Math.round(xToYear(clickX))));
    showContextMenuItems(e.clientX, e.clientY, [
      { ico: '➕', label: `Agregar tarjeta en ${clickedYear}`, action: () => addNewEntryAtYear(clickedYear, getAboveCats()[0] || 'IMAGEN') },
    ]);
  });

  // ── Prevent browser zoom ──
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey||e.metaKey) && (e.key==='+' || e.key==='-' || e.key==='0')) {
      e.preventDefault();
    }
  });

  // ── Year cursor tooltip ──
  const yrCursor = document.createElement('div');
  yrCursor.id = 'yr-cursor';
  document.body.appendChild(yrCursor);

  vp?.addEventListener('mousemove', (e) => {
    const rect = vp.getBoundingClientRect();
    const canvasX = e.clientX - rect.left + vp.scrollLeft;
    const year = Math.round(xToYear(canvasX));
    if (year >= C.START_YEAR - 20 && year <= 2035) {
      yrCursor.textContent = '\u25CE ' + year;
      yrCursor.style.display = 'block';
      // Badge anclado a la línea del eje: solo sigue el movimiento HORIZONTAL
      const w = yrCursor.offsetWidth  || 58;
      const h = yrCursor.offsetHeight || 22;
      // Sigue al cursor: justo arriba del puntero, centrado en X (como Figma Make)
      const lx = Math.max(rect.left + 4, Math.min(rect.right - w - 4, e.clientX - w / 2));
      const ty = Math.max(rect.top + 4,  Math.min(rect.bottom - h - 4, e.clientY - h - 12));
      yrCursor.style.left = lx + 'px';
      yrCursor.style.top  = ty + 'px';
    }
  });
  vp?.addEventListener('mouseleave', () => { yrCursor.style.display = 'none'; });

  // ── Click en fondo del timeline → tarjeta más cercana ──
  vp?.addEventListener('click', (e) => {
    if (e.target.closest('.entry-card') || e.target.closest('#ctx-menu')) return;
    if (APP.editMode) return;
    const rect = vp.getBoundingClientRect();
    const canvasX = e.clientX - rect.left + vp.scrollLeft;
    const clickYear = xToYear(canvasX);
    const entries = getAllEntries();
    if (!entries.length) return;
    let nearest = entries[0], minDist = Infinity;
    for (const en of entries) {
      const d = Math.abs(en.year - clickYear);
      if (d < minDist) { minDist = d; nearest = en; }
    }
    scrollToEntry(nearest.id);
    setTimeout(() => {
      const card = document.querySelector(`.entry-card[data-id="${nearest.id}"]`);
      if (card) {
        card.style.transition = 'box-shadow .1s';
        card.style.boxShadow = `0 0 0 3px ${getCatMeta(nearest.category).color}aa`;
        setTimeout(() => { card.style.boxShadow = ''; }, 600);
      }
    }, 350);
  });

  // ── Sidebar resizer ──
  initSidebarResize();

  // ── Scroll: enforce bounds + sync sidebar + carousel tracking ──
  let _carSyncTimer = null;
  vp?.addEventListener('scroll', () => {
    enforceScrollBounds();
    enforceVerticalScrollBounds();
    syncSidebarScroll();
    positionHalo();
    clearTimeout(_carSyncTimer);
    _carSyncTimer = setTimeout(syncCarouselToViewport, 250);
  });

  // ── Initial scroll: show from 1785 (start of timeline) ──
  setTimeout(() => {
    if (!vp) return;
    vp.scrollLeft = 0; // start at the very beginning (1785)
    enforceScrollBounds();
    enforceVerticalScrollBounds();
  }, 120);

  window.addEventListener('resize', () => { positionHalo(); syncSidebarScroll(); });
}

/* ── Image Rotator ──────────────────────────────────────── */
const _hirState = { urls: [], idx: 0, ping: false };

function initHeaderImageRotator() {
  const base    = Object.values(IMAGES);
  const custom  = Object.values(APP.customImages || {}).filter(u => u && typeof u === 'string' && u.startsWith('http'));
  const combined = [...new Set([...base, ...custom])];
  _hirState.urls = combined.length ? combined : base;
  _hirState.idx  = 0;

  const frameA = document.getElementById('hir-a');
  const frameB = document.getElementById('hir-b');
  if (!frameA || !frameB || !_hirState.urls.length) return;

  frameA.style.backgroundImage = `url(${_hirState.urls[0]})`;
  frameA.classList.add('active');
  frameB.classList.remove('active');

  setInterval(() => {
    _hirState.idx = (_hirState.idx + 1) % _hirState.urls.length;
    const nextUrl = _hirState.urls[_hirState.idx];
    if (!_hirState.ping) {
      frameB.style.backgroundImage = `url(${nextUrl})`;
      frameB.classList.add('active');
      frameA.classList.remove('active');
    } else {
      frameA.style.backgroundImage = `url(${nextUrl})`;
      frameA.classList.add('active');
      frameB.classList.remove('active');
    }
    _hirState.ping = !_hirState.ping;
  }, 2800);
}

/* ── Header Clock ───────────────────────────────────────── */
const _DIAS_ES  = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const _MESES_ES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

function initHeaderClock() {
  const el = document.getElementById('footer-clock');
  if (!el) return;
  function tick() {
    const n   = new Date();
    const dia = _DIAS_ES[n.getDay()];
    const dd  = String(n.getDate()).padStart(2, '0');
    const mes = _MESES_ES[n.getMonth()];
    const yy  = n.getFullYear();
    const hh  = String(n.getHours()).padStart(2, '0');
    const mm  = String(n.getMinutes()).padStart(2, '0');
    const ss  = String(n.getSeconds()).padStart(2, '0');
    const ds  = Math.floor(n.getMilliseconds() / 100);
    el.textContent = `${dia} ${dd} ${mes} ${yy}  ·  ${hh}:${mm}:${ss}.${ds}`;
  }
  tick();
  setInterval(tick, 100);
  // Right-click: cambiar tipografía / tamaño
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const FONTS = [
      { label: 'Monoespaciada (defecto)', value: "var(--font-mono)" },
      { label: 'Sans-serif',              value: "var(--font-sans)" },
      { label: 'Serif',                   value: "'Georgia','Times New Roman',serif" },
      { label: 'Courier',                 value: "'Courier New',Courier,monospace" },
    ];
    const SIZES = ['9px','10px','11px','12px','13px'];
    const curFont = localStorage.getItem('__clock_font__') || FONTS[0].value;
    const curSize = localStorage.getItem('__clock_size__') || '10px';
    const items = [
      ...FONTS.map(f => ({ ico: curFont === f.value ? '✓' : '\u00a0', label: f.label, action: () => {
        localStorage.setItem('__clock_font__', f.value);
        el.style.fontFamily = f.value;
      }})),
      { sep: true },
      ...SIZES.map(s => ({ ico: curSize === s ? '✓' : '\u00a0', label: s, action: () => {
        localStorage.setItem('__clock_size__', s);
        el.style.fontSize = s;
      }})),
    ];
    showContextMenuItems(e.clientX, e.clientY, items);
  });
  // Restaurar preferencias guardadas
  const savedFont = localStorage.getItem('__clock_font__');
  const savedSize = localStorage.getItem('__clock_size__');
  if (savedFont) el.style.fontFamily = savedFont;
  if (savedSize) el.style.fontSize   = savedSize;
}

  if (!bar) return;
  bar.innerHTML = '';
  if (!APP.customMarkers || APP.customMarkers.length === 0) return;
  APP.customMarkers.forEach(mk => {
    const chip = document.createElement('button');
    chip.className = 'hdr-mk-chip';
    chip.title = `Ir al primer elemento con marcador "${mk.name}"`;
    chip.style.background  = mk.color + '22';
    chip.style.borderColor = mk.color + '55';
    chip.style.color       = mk.color;
    const dot = document.createElement('span');
    dot.className = 'hdr-mk-dot';
    dot.style.background = mk.color;
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(mk.name.toUpperCase()));
    chip.addEventListener('click', () => {
      const target = getAllEntries().find(e => (e.markers || []).includes(mk.id));
      if (target) {
        scrollToEntry(target.id);
        showToast(`📍 ${mk.name} → ${target.year} · ${target.title}`);
      } else {
        showToast(`📍 Sin tarjetas con marcador "${mk.name}"`);
      }
    });
    bar.appendChild(chip);
  });
}

/* ════════════════════════════════════════════════════════════
   PART 19 · INIT
   ════════════════════════════════════════════════════════════ */

document.addEventListener('DOMContentLoaded', () => {
  // Load persisted state
  loadFromStorage();

  // Inject halo overlay
  if (!document.getElementById('halo-overlay')) {
    const halo = document.createElement('div');
    halo.id = 'halo-overlay';
    halo.setAttribute('aria-hidden', 'true');
    document.body.appendChild(halo);
  }

  // Initial render
  renderSidebar();
  renderTimeline();
  renderCarousel();
  updateZoomDisplay();
  positionHalo();
  syncSidebarScroll(); // ensure translateY=0 on init

  // Restaurar posición de navegación guardada (desde localStorage al inicio)
  setTimeout(() => {
    const vp = document.getElementById('tl-viewport');
    if (vp) {
      if (APP._pendingScrollX !== null && APP._pendingScrollX !== undefined) vp.scrollLeft = APP._pendingScrollX;
      if (APP._pendingScrollY !== null && APP._pendingScrollY !== undefined) vp.scrollTop  = APP._pendingScrollY;
      APP._pendingScrollX = null;
      APP._pendingScrollY = null;
    }
  }, 150);

  // Start carousel auto-advance
  startCarouselTimer();

  // Wire events
  setupEvents();

  // ── Header enhancements ──
  initHeaderClock();
  initHeaderImageRotator();
  hookYearInHeader();
  renderHeaderMarkers();
  initHeaderColorPicker();

  // Show welcome hint (only first visit)
  if (!localStorage.getItem('av-timeline-visited')) {
    localStorage.setItem('av-timeline-visited', '1');
    setTimeout(() => showToast('🎬 Ctrl+Rueda para zoom H · Alt+Rueda para zoom V · Clic en tarjeta para detalle', 5000), 1200);
  }
});


/* ── Header background color picker (clic derecho sobre #header) ─── */
function initHeaderColorPicker() {
  const header = document.getElementById('header');
  if (!header) return;

  const STORAGE_KEY = '__header_bg__';
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) header.style.background = saved;

  const PRESETS = [
    { label: 'Original',    value: '' },
    { label: 'Negro',       value: 'rgba(0,0,0,.98)' },
    { label: 'Azul marino', value: 'rgba(5,12,35,.97)' },
    { label: 'Púrpura',     value: 'rgba(18,8,38,.97)' },
    { label: 'Verde',       value: 'rgba(4,22,14,.97)' },
    { label: 'Rojo',        value: 'rgba(22,4,4,.97)' },
    { label: 'Antracita',   value: 'rgba(14,14,18,.97)' },
    { label: 'Índigo',      value: 'rgba(12,12,48,.97)' },
  ];

  function applyBg(v) {
    if (v) { header.style.background = v; localStorage.setItem(STORAGE_KEY, v); }
    else   { header.style.background = ''; localStorage.removeItem(STORAGE_KEY); }
  }

  function closeMenu() {
    document.getElementById('hdr-bg-menu')?.remove();
    document.getElementById('hdr-bg-shield')?.remove();
  }

  header.addEventListener('contextmenu', (e) => {
    // Permitir context menu nativo si el clic fue en un input/botón
    if (e.target.closest('input, button, .hdr-mk-chip, .hdr-mk-del')) return;
    e.preventDefault();
    closeMenu();

    const shield = document.createElement('div');
    shield.id = 'hdr-bg-shield';
    Object.assign(shield.style, {
      position: 'fixed', inset: '0', zIndex: '9998', background: 'transparent',
    });
    shield.addEventListener('click', closeMenu);
    shield.addEventListener('contextmenu', (ev) => { ev.preventDefault(); closeMenu(); });
    document.body.appendChild(shield);

    const menu = document.createElement('div');
    menu.id = 'hdr-bg-menu';
    Object.assign(menu.style, {
      position: 'fixed',
      left: Math.min(e.clientX, window.innerWidth - 230) + 'px',
      top:  (e.clientY + 4) + 'px',
      zIndex: '9999',
      background: '#0d0d2b',
      border: '1px solid rgba(99,102,241,.35)',
      borderRadius: '10px',
      padding: '12px 14px',
      minWidth: '210px',
      boxShadow: '0 8px 40px rgba(0,0,0,.8)',
      fontFamily: 'var(--font-mono)',
      color: '#e5e7eb',
    });

    const title = document.createElement('div');
    title.textContent = 'Fondo del Header';
    Object.assign(title.style, {
      color: '#6b74a8', fontSize: '8.5px', letterSpacing: '2px',
      textTransform: 'uppercase', marginBottom: '10px',
    });
    menu.appendChild(title);

    const swatches = document.createElement('div');
    Object.assign(swatches.style, { display: 'flex', flexWrap: 'wrap', gap: '6px', marginBottom: '10px' });
    const currentBg = localStorage.getItem(STORAGE_KEY) || '';
    PRESETS.forEach(({ label, value }) => {
      const sw = document.createElement('button');
      sw.title = label;
      Object.assign(sw.style, {
        width: '24px', height: '24px', borderRadius: '5px',
        background: value || 'rgba(5,5,22,.96)',
        border: currentBg === value ? '2px solid #818cf8' : '1px solid rgba(255,255,255,.18)',
        cursor: 'pointer', padding: '0',
      });
      sw.addEventListener('click', () => { applyBg(value); closeMenu(); });
      swatches.appendChild(sw);
    });
    menu.appendChild(swatches);

    const customRow = document.createElement('div');
    Object.assign(customRow.style, { display: 'flex', alignItems: 'center', gap: '8px' });
    const lbl = document.createElement('span');
    lbl.textContent = 'Color libre:';
    Object.assign(lbl.style, { color: '#9ca3af', fontSize: '9.5px' });
    const picker = document.createElement('input');
    picker.type = 'color';
    picker.value = '#050516';
    Object.assign(picker.style, { width: '32px', height: '24px', cursor: 'pointer', borderRadius: '4px', border: '1px solid rgba(255,255,255,.15)' });
    picker.addEventListener('input', (ev) => {
      const h = ev.target.value;
      const r = parseInt(h.slice(1,3), 16);
      const g = parseInt(h.slice(3,5), 16);
      const b = parseInt(h.slice(5,7), 16);
      applyBg(`rgba(${r},${g},${b},.97)`);
    });
    customRow.appendChild(lbl);
    customRow.appendChild(picker);
    menu.appendChild(customRow);

    if (currentBg) {
      const reset = document.createElement('button');
      reset.textContent = '↺ Restablecer original';
      Object.assign(reset.style, {
        marginTop: '10px', fontSize: '9.5px', color: '#6b74a8',
        background: 'none', border: 'none', cursor: 'pointer', padding: '0',
        textDecoration: 'underline', fontFamily: 'var(--font-mono)',
      });
      reset.addEventListener('click', () => { applyBg(''); closeMenu(); });
      menu.appendChild(reset);
    }

    document.body.appendChild(menu);
  });
}
